# Overlay for CPU-only hosts: `docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d`
services:
  verity:
    image: ghcr.io/adper0705/verity:cpu
    build:
      args:
        VERITY_PROFILE: cpu
    environment:
      VERITY_HW_PROFILE: cpu
    deploy:
      resources:
        reservations:
          devices: []
