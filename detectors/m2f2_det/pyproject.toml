# Managed with uv (source of truth for this detector's environment).
# Python 3.12: newest version with wheels for every pinned dependency.
# torchvision supplies EfficientNet-B4; transformers the CLIP ViT-L/14-336 tower.
[project]
name = "verity-m2f2-det"
version = "1.0.0"
description = "Verity detector environment: m2f2_det (M2F2-Det stage-1 detector)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "numpy<2",
    "opencv-python==4.10.0.84",
    "pillow==10.2.0",
    "matplotlib==3.9.2",
    "facenet-pytorch==2.5.1",
    "mediapipe==0.10.18",
    "pyyaml",
    "transformers>=4.36",
    "safetensors"
]

[tool.uv]
package = false
