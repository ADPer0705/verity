# Managed with uv (source of truth for this detector's environment).
# Python 3.12: newest version with wheels for every pinned dependency.
# torch 2.8.0 (cu128 wheels) supplies the CUDA 12 / cuDNN 9 libraries that
# onnxruntime-gpu 1.23.x (CUDA 12 build) needs; model.py calls
# onnxruntime.preload_dlls() so the session finds them. The cpu profile
# falls back to onnxruntime's CPUExecutionProvider automatically.
[project]
name = "verity-xlsr-sls"
version = "1.0.0"
description = "Verity detector environment: xlsr_sls (XLS-R + SLS, ONNX)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "numpy<2",
    "opencv-python==4.10.0.84",
    "pillow==10.2.0",
    "matplotlib==3.9.2",
    "pyyaml",
    "onnxruntime-gpu==1.23.2"
]

[tool.uv]
package = false
