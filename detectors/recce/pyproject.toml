# Managed with uv (source of truth for this detector's environment).
# Python 3.12: newest version with wheels for every pinned dependency
# (torch/mediapipe/torchvision cap at 3.12); nothing requires <3.12.
[project]
name = "verity-recce"
version = "1.0.0"
description = "Verity detector environment: recce"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.2.2",
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    "pillow==10.2.0",
    "matplotlib==3.9.2",
    "facenet-pytorch==2.6.0",
    "mediapipe==0.10.18",
    "timm==1.0.14"
]

[tool.uv]
package = false
