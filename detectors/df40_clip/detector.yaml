detector_id: df40_clip
version: 1.0.0
name: DF40 CLIP
description: CLIP ViT-L/14 deepfake detector fine-tuned on the DF40 benchmark (Yan et al., NeurIPS 2024 D&B, arXiv
  2406.13495); the train_on_df40 checkpoint covers face-swap, face-reenactment and entire-face-synthesis methods.
architecture: CLIP ViT-L/14 vision tower (fully fine-tuned) + Linear(1024, 2) head
parameters: 303179778
pretrained: 'Official DF40 checkpoint df40_weights/train_on_df40/clip_large.pth (Google Drive, YZY-stack/DF40). The
  architecture is instantiated from openai/clip-vit-large-patch14 (fetched by transformers at first run, HF cache) and
  every tensor is then overwritten by the checkpoint.'
resolution: 224
mean:
- 0.5
- 0.5
- 0.5
std:
- 0.5
- 0.5
- 0.5
video_mode: false
clip_size: null
input_mode: face_crop
min_face: 30
# No Grad-CAM through the ViT; the model returns the last-layer CLS attention over the 16x16 patch grid as attention_map.
cam: false
artifacts:
  required:
  - type: face_crop
    params:
      resolution: 224
output:
  format: json
  schema:
    prediction: float
    confidence: float
    reasoning: str
    confidence_factors: list
    attention_maps: str
weights:
  # Alternates (same architecture, drop-in via this field; see weights/README.md):
  #   train_on_fs/clip_large.pth  (Drive id 1RN6nCuApp0tSaku0FyBAi7uw3xV-CuWv) -> targets [face_swap]
  #   train_on_fr/clip_large.pth  (Drive id 1dvUK1xWOYpReygwwvoCZbwSg71dbOEI_) -> targets [face_reenactment]
  #   train_on_efs/clip_large.pth (Drive id 1RWEoYAscBLTH8Bgeq55Tr5eDmL632AoQ) -> targets [face_synthesis]
  file: df40_train_on_df40_clip_large.pth
  kind: official
  trained: true
  url: https://drive.google.com/drive/folders/1HDgIOutGw3jsFXwvSQYeDoVPAzgfYbyr
  license: CC-BY-NC-4.0
  size: 1212881455
  sha256: a033da18fb0152e69e47b4e2338867f62c05d51656639c745402bf7c07dd7259
  note: Official DF40 CLIP-L/14 checkpoint trained on all DF40 training families (train_on_df40/clip_large.pth); contains
    the full fine-tuned vision tower and head (strict key match). The openai/clip-vit-large-patch14 backbone is fetched
    from HuggingFace at first run only to instantiate the architecture (shared HF cache with univfd/gend/effort).
targets:
- face_swap
- face_reenactment
- face_synthesis
