# Managed with uv (source of truth for this detector's environment).
# Python 3.12: newest version with wheels for every pinned dependency
# (torch/mediapipe/torchvision cap at 3.12); nothing requires <3.12.
[project]
name = "verity-community-forensics"
version = "1.0.0"
description = "Verity detector environment: community_forensics (Community Forensics ViT-S/16-384)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.2.2",
    "numpy<2",
    "opencv-python==4.10.0.84",
    "pillow==10.2.0",
    "matplotlib==3.9.2",
    "pyyaml",
    "timm==1.0.15",
    "safetensors==0.4.2"
]

[tool.uv]
package = false
