detector_id: rawnet2
version: 1.0.0
name: RawNet2 (RawBoost)
description: End-to-end RawNet2 audio anti-spoofing (Tak et al., ICASSP 2021) trained with RawBoost raw-waveform
  augmentation (Tak et al., ICASSP 2022) - sinc filterbank, residual blocks with feature-map scaling, GRU.
  ASVspoof 2021 LA baseline family.
architecture: Fixed mel sinc filterbank (20 x 1024) + 6 residual blocks with FMS + 3-layer GRU(1024) + FC(1024) + FC(2)
parameters: 25100000
pretrained: TakHemlata/RawBoost-antispoofing pre_trained_model/Best_model.pth (ASVspoof2019 LA train + RawBoost)
resolution: 0
mean:
- 0.0
- 0.0
- 0.0
std:
- 1.0
- 1.0
- 1.0
video_mode: false
input_mode: audio
audio_sample_rate: 16000
audio_window_seconds: 4.0375
audio_hop_seconds: 2.0
cam: false
region_analysis: false
weights:
  file: Best_model.pth
  kind: official
  url: https://raw.githubusercontent.com/TakHemlata/RawBoost-antispoofing/main/pre_trained_model/Best_model.pth
  size: 70515422
  sha256: d8afc379456876c78fa08e61d5fcc66bba6f459b30bbbf3dcb7a7f0731e701aa
  license: MIT
  trained: true
  note: 'Official RawBoost-trained RawNet2 checkpoint (EURECOM, MIT). Trained only on ASVspoof2019 LA
    (2019-era TTS/VC) with RawBoost augmentation for ASVspoof 2021 LA; like AASIST it is a benchmark-era
    baseline and should not be expected to generalise to modern in-the-wild voice clones. Upstream logits
    [spoof, bonafide] are swapped so index 1 = fake. Fixed 64,600-sample input (window 4.0375 s).'
artifacts:
  required:
  - type: audio
    params:
      sample_rate: 16000
output:
  format: json
  schema:
