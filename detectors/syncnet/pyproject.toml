# Managed with uv (source of truth for this detector's environment).
# Python 3.12: newest version with wheels for every pinned dependency.
[project]
name = "verity-syncnet"
version = "1.0.0"
description = "Verity detector environment: syncnet (SyncNet lip-sync measurement)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "numpy<2",
    "opencv-python==4.10.0.84",
    "pillow==10.2.0",
    "matplotlib==3.9.2",
    "facenet-pytorch==2.5.1",
    "pyyaml",
    "python-speech-features==0.6",
    "scipy"
]

[tool.uv]
package = false
