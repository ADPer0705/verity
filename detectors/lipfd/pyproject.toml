# Managed with uv (source of truth for this detector's environment).
# Python 3.12: newest version with wheels for every pinned dependency.
# librosa renders the mel spectrogram exactly as upstream preprocess.py.
[project]
name = "verity-lipfd"
version = "1.0.0"
description = "Verity detector environment: lipfd (LipFD audio-visual lip-sync detector)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "numpy<2",
    "opencv-python==4.10.0.84",
    "pillow==10.2.0",
    "matplotlib==3.9.2",
    "facenet-pytorch==2.5.1",
    "pyyaml",
    "librosa==0.10.2.post1"
]

[tool.uv]
package = false
