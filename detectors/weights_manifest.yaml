      arXiv:2307.01426
    note: >-
      Detector checkpoints were trained on FaceForensics++ (c23), a dataset
      released for research use. The DeepfakeBench LICENSE text names the
      source code; the released weights carry no separate statement and are
      treated as CC BY-NC 4.0 as well.
