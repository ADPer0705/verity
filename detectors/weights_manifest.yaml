# Verity weights manifest (v2).
#
# Single source of truth for every checkpoint Verity can fetch: where it
# comes from, its SHA-256, its license, and whether Verity is allowed to
# re-host it on its own Hugging Face repo. `verity weights pull` reads this
# file; `verity weights bundle` assembles the Hugging Face upload from it.
#
# Resolution order for a file: the Verity hub (if `hub.huggingface_repo` is
# set and the file is `redistributable`), then `origin`. Every download is
# verified against `sha256` before it is accepted.
#
# Licenses were checked against the upstream repositories on 2026-10-20.
# "redistributable: false" means the upstream grants no redistribution right
# (no license file at all, or a non-transferable one); those files are only
# ever fetched from the authors' own URLs.
version: 2

hub:
  # Hugging Face model repo that mirrors the redistributable files below.
  # Leave empty to always fetch from origin. Override with VERITY_WEIGHTS_HUB.
  huggingface_repo: "ADPer/verity-weights"
  revision: main

licenses:
  CC-BY-NC-4.0: https://creativecommons.org/licenses/by-nc/4.0/
  CC-BY-NC-SA-4.0: https://creativecommons.org/licenses/by-nc-sa/4.0/
  MIT: https://opensource.org/license/mit
  BSD-3-Clause: https://opensource.org/license/bsd-3-clause
  Apache-2.0: https://www.apache.org/licenses/LICENSE-2.0

sources:
