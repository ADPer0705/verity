# Which manifest files each detector needs, and where they land under
# detectors/<id>/weights/ (string = same name; mapping = {file, dest}).
detectors:
  xception:
  - xception_best.pth
  meso4:
  - meso4_best.pth
  meso4Inception:
  - meso4Incep_best.pth
  resnet34:
  - cnnaug_best.pth
  efficientnetb4:
  - effnb4_best.pth
  capsule_net:
  - capsule_best.pth
  core:
  - core_best.pth
  f3net:
  - f3net_best.pth
  ffd:
  - ffd_best.pth
  spsl:
  - spsl_best.pth
  srm:
  - srm_best.pth
  ucf:
  - ucf_best.pth
  recce:
  - recce_best.pth
  i3d:
  - I3D_8x8_R50.pth
  ftcn:
  - I3D_8x8_R50.pth
  altfreezing:
  - I3D_8x8_R50.pth
  facexray:
  - file: hrnetv2_w48_imagenet_pretrained.pth
    dest: pretrained/hrnetv2_w48_imagenet_pretrained.pth
  iid:
  - file: xception-b5690688.pth
    dest: pretrained/xception-b5690688.pth
  univfd:
  - fc_weights.pth
  lipforensics:
  - lipforensics_ff.pth
  npr:
  - NPR.pth
  mlep:
  - model_epoch_best.pth
  aasist:
  - AASIST.pth
  community_forensics:
  - model.safetensors
  safe:
  - checkpoint-best.pth
  xlsr_sls:
  - xlsr-sls.onnx
  effort:
  - effort_clip_L14_trainOn_FaceForensic.pth
  df40_clip:
  - df40_train_on_df40_clip_large.pth

# Weights fetched by the detector itself at first run (HF hub / torch hub);
# listed for license tracking only, never re-hosted by Verity.
runtime_fetched:
  clip: openai/clip-vit-base-patch16 (HF, MIT)
  univfd: openai/clip-vit-large-patch14 (HF, MIT) backbone
  gend: "yermandy/GenD_CLIP_L_14 (HF, MIT) \u2014 released detector"
  effort: openai/clip-vit-large-patch14 (HF, MIT) backbone, used to instantiate the
    architecture; the trained Effort head itself comes from the weights manifest
  df40_clip: openai/clip-vit-large-patch14 (HF, MIT) backbone, used to instantiate the
    architecture; the trained DF40 head itself comes from the weights manifest
  antideepfake_mms: nii-yamagishilab/mms-300m-anti-deepfake (HF, CC BY-NC-SA 4.0
    checkpoint; BSD-3-Clause detector code) — fetched intact by huggingface_hub
    at first run; XLS-R-1B variant via VERITY_ANTIDEEPFAKE_REPO
  videomae: MCG-NJU/videomae-base (HF, CC BY-NC 4.0)
  xclip: microsoft/xclip-base-patch32 (HF, MIT)
  timesformer: facebook/timesformer-base-finetuned-k400 (HF, CC BY-NC 4.0)
  uia_vit: nothing is fetched today (random init); upstream uses timm jx_vit_base_p16_224 (Apache-2.0)
  stil: nothing is fetched today (random init); upstream uses SCNet50-v1d ImageNet (backseason/SCNet, MIT)
  aeroblade: "CompVis/stable-diffusion-v1-1 (OpenRAIL-M), stabilityai/stable-diffusion-2-1-base (OpenRAIL++;\
    \ gated on HF), kandinsky-community/kandinsky-2-1 (Apache-2.0), LPIPS VGG (BSD-2) \u2014 training-free"

# Detectors with no trained checkpoint anywhere Verity may use.
no_checkpoint:
  sbi: No released trained checkpoint; random initialisation. Upstream SBI weights exist but their license
