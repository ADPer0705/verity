# Managed with uv (source of truth for this detector's environment).
# Python 3.12: newest version with wheels for every pinned dependency.
# torch 2.8.0 + transformers 4.56.2 (Wav2Vec2Model); no fairseq needed.
[project]
name = "verity-antideepfake-mms"
version = "1.0.0"
description = "Verity detector environment: antideepfake_mms (AntiDeepfake MMS-300M)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "numpy<2",
    "opencv-python==4.10.0.84",
    "pillow==10.2.0",
    "matplotlib==3.9.2",
    "pyyaml",
    "transformers==4.56.2",
    "safetensors",
    "huggingface_hub"
]

[tool.uv]
package = false
