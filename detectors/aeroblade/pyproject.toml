# Managed with uv (source of truth for this detector's environment).
# Python 3.12: newest version with wheels for every pinned dependency
# (torch/mediapipe/torchvision cap at 3.12); nothing requires <3.12.
[project]
name = "verity-aeroblade"
version = "1.0.0"
description = "Verity detector environment: aeroblade (AEROBLADE)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.2.2",
    "numpy<2",
    "opencv-python==4.10.0.84",
    "pillow==10.2.0",
    "matplotlib==3.9.2",
    "facenet-pytorch==2.6.0",
    "mediapipe==0.10.18",
    "pyyaml",
    "diffusers==0.25.1",
    "accelerate==0.26.1",
    "transformers==4.37.2",
    "huggingface_hub==0.25.2",
    "setuptools>=68",
    "safetensors==0.4.2",
    "lpips==0.1.4"
]

[tool.uv]
package = false
