# Managed with uv (source of truth for this detector's environment).
# Python 3.12: newest version with wheels for every pinned dependency.
# Pure torch (vendored AASIST.py); no audio libraries needed.
[project]
name = "verity-aasist"
version = "1.0.0"
description = "Verity detector environment: aasist (AASIST)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.2.2",
    "numpy<2",
    "opencv-python==4.10.0.84",
    "pillow==10.2.0",
    "matplotlib==3.9.2",
    "pyyaml"
]

[tool.uv]
package = false
