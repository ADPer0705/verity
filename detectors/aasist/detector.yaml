detector_id: aasist
version: 1.0.0
name: AASIST
description: AASIST raw-waveform audio anti-spoofing (Jung et al., ICASSP 2022) - sinc-conv front-end, residual encoder,
  heterogeneous stacking graph attention. ASVspoof2019 LA baseline.
architecture: SincConv(70) + 6 residual blocks + spectral/temporal graph attention (HS-GAL, MGO) + Linear(160, 2)
parameters: 297000
pretrained: clovaai/aasist models/weights/AASIST.pth (ASVspoof2019 LA trained)
resolution: 0
mean:
- 0.0
