# Verity — docker compose runtime.
#
#   docker compose up -d                      # web console + API on 127.0.0.1:8000
#   docker compose run --rm verity run --media /input/suspect.mp4   # one-off CLI run
#   docker compose run --rm verity weights pull --trained           # pre-fetch checkpoints
#   docker compose run --rm verity setup --trained                  # pre-build detector envs
#
# Named volumes persist detector environments, checkpoints, model caches and
# the workspace across upgrades; ./input and ./output are host bind mounts.
#
# The published image is :slim. The pre-baked :cuda/:cpu images are optional
# manual builds (see docs/publishing.md); set VERITY_IMAGE to use one.
#
# GPU hosts keep the `deploy` block (NVIDIA Container Toolkit required).
# CPU-only hosts use the overlay:
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d
services:
  verity:
    image: ${VERITY_IMAGE:-ghcr.io/adper0705/verity:slim}
    restart: unless-stopped
    ports:
      # Loopback by default: the API has no authentication. For LAN access put
      # an authenticating reverse proxy in front and set VERITY_BIND=0.0.0.0.
      - "${VERITY_BIND:-127.0.0.1}:8000:8000"
    environment:
      VERITY_HW_PROFILE: ${VERITY_HW_PROFILE:-auto}
      VERITY_WEIGHTS_AUTO: "1"            # fetch missing checkpoints on start
      VERITY_WEIGHTS_HUB: ${VERITY_WEIGHTS_HUB:-}   # empty: manifest mirror
      VERITY_OFFLINE: ${VERITY_OFFLINE:-}           # "1": never download
      VERITY_DETECTOR_TIMEOUT: ${VERITY_DETECTOR_TIMEOUT:-3600}
    volumes:
      - verity-envs:/envs
      - verity-weights:/weights
      - verity-cache:/cache
      - verity-workspace:/workspace
      - ./input:/input:ro
      - ./output:/output
    security_opt:
      - label=disable                     # SELinux hosts: allow the bind mounts
    shm_size: "2g"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/system"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  verity-envs:
  verity-weights:
  verity-cache:
  verity-workspace:
