# Verity — docker compose convenience.
#
#   docker compose up -d                      # web console + API on http://localhost:8000
#   docker compose run --rm verity run --media /input/suspect.mp4   # one-off CLI run
#   docker compose run --rm verity weights pull --trained           # pre-fetch checkpoints
#
# Named volumes persist detector environments, checkpoints, model caches and
# the workspace across upgrades; ./input and ./output are host bind mounts.
#
# GPU hosts: keep the `deploy` block below (requires the NVIDIA Container
# Toolkit). CPU-only hosts: delete it, or run `docker compose -f
# docker-compose.yml -f docker-compose.cpu.yml up`.
services:
  verity:
    image: ghcr.io/adper0705/verity:cuda     # or :slim / :cpu — see README
    build:
      context: .
      target: full
      args:
        VERITY_PROFILE: cuda
    ports:
      - "8000:8000"
    environment:
      VERITY_HW_PROFILE: auto             # auto | cuda | cpu
      VERITY_WEIGHTS_AUTO: "1"            # fetch missing checkpoints on start
      VERITY_WEIGHTS_HUB: ""              # e.g. ADPer0705/verity-weights
      VERITY_OFFLINE: ""                  # "1": never download anything
      VERITY_DETECTOR_TIMEOUT: "3600"
    volumes:
      - verity-envs:/envs
      - verity-weights:/weights
      - verity-cache:/cache
      - verity-workspace:/workspace
      - ./input:/input:ro
      - ./output:/output
    security_opt:
      - label=disable                     # SELinux hosts: allow the bind mounts
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  verity-envs:
  verity-weights:
  verity-cache:
  verity-workspace:
