name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: System packages (ffmpeg, WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libpango-1.0-0 libpangocairo-1.0-0 libcairo2
      - run: uv sync --frozen --extra api
      - run: uv run pytest -q
      - name: Manifest sanity
        run: uv run verity weights status
      - name: Deploy bundle sanity
        run: |
          bash -n deploy/install.sh
          bash -n deploy/doctor.sh
          uv run python scripts/build_deploy_bundle.py --out dist-deploy
          tar tzf dist-deploy/verity-deploy-*.tar.gz >/dev/null

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/verity_ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/verity_ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  image-slim:
    runs-on: ubuntu-latest
    needs: [test, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build slim image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: slim
          push: false
          tags: verity:slim
          cache-from: type=gha
          cache-to: type=gha,mode=max
