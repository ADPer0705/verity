name: Deploy Wiki

on:
  push:
    branches: [main]
    paths:
      - 'openwiki/**'
      - 'website/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install wiki dependencies
        working-directory: website
        run: npm ci --no-audit --no-fund
      - name: Stage OpenWiki and build VitePress site
        working-directory: website
        run: npm run build
      - name: Verify built output and CNAME
        run: |
          test -f website/.vitepress/dist/index.html
          test -f website/.vitepress/dist/quickstart.html
          grep -qx 'verity.dearanayji.rocks' website/.vitepress/dist/CNAME
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
