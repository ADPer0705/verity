# Publishes the standalone Linux binary, installer, slim container image, and
# lab deploy bundle on a version tag.
#
# Only the slim image is built on GitHub's hosted runners: the pre-baked
# `full` images are 10-20 GB and exceed the hosted runner disk. Build those
# on a machine with enough disk and push them by hand (see
# openwiki/operations/releasing-and-publishing.md), or point `runs-on` at a
# self-hosted runner.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  slim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},suffix=-slim
            type=raw,value=slim
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: slim
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binary:
    # Build on Ubuntu 22.04 (glibc 2.35) so the single binary runs across
    # Ubuntu 22.04/24.04, Debian 12+, RHEL 9+, Fedora 38+, and newer distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/verity_ui/package-lock.json
      - name: System packages (ffmpeg, OpenCV, WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libpango-1.0-0 libpangocairo-1.0-0 libcairo2 libgdk-pixbuf-2.0-0 libgl1 libglib2.0-0
      - name: Validate one-line installer
        run: bash -n install.sh
      - name: Build Web UI SPA
        working-directory: src/verity_ui
        run: npm ci --no-audit --no-fund && npm run build
      - name: Install build env
        run: |
          uv python install 3.12
          uv sync --frozen --python 3.12 --extra api --extra build
      - name: Build standalone verity binary
        run: uv run --python 3.12 python scripts/build_binary.py --version "$GITHUB_REF_NAME" --out dist-release
      - name: Verify checksums and smoke-test standalone binary outside repo
        run: |
          (cd dist-release && sha256sum -c verity-linux-x86_64.sha256)
          mkdir -p /tmp/verity-smoke
          cp dist-release/verity-linux-x86_64 /tmp/verity-smoke/verity
          VERITY_HOME=/tmp/verity-smoke/home /tmp/verity-smoke/verity --version
          VERITY_HOME=/tmp/verity-smoke/home /tmp/verity-smoke/verity --help >/dev/null
          VERITY_HOME=/tmp/verity-smoke/home /tmp/verity-smoke/verity weights status >/dev/null
          VERITY_HOME=/tmp/verity-smoke/home /tmp/verity-smoke/verity doctor || true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/verity-*
            install.sh
          generate_release_notes: true

  deploy-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate installer scripts
        run: |
          bash -n deploy/install.sh
          bash -n deploy/doctor.sh
      - name: Build deploy bundle
        run: python scripts/build_deploy_bundle.py --version "$GITHUB_REF_NAME" --out dist-deploy
      - name: Inspect bundle
        run: |
          tar tzf "dist-deploy/verity-deploy-${GITHUB_REF_NAME#v}.tar.gz"
          cat dist-deploy/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-deploy/verity-deploy-*.tar.gz
            dist-deploy/verity-deploy.tar.gz
            dist-deploy/SHA256SUMS*
          generate_release_notes: true
