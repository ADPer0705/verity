# Publishes the slim container image and the lab deploy bundle on a version tag.
#
# Only the slim image is built on GitHub's hosted runners: the pre-baked
# `full` images are 10-20 GB and exceed the hosted runner disk. Build those
# on a machine with enough disk and push them by hand (see docs/publishing.md),
# or point `runs-on` at a self-hosted runner.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  slim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},suffix=-slim
            type=raw,value=slim
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: slim
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate installer scripts
        run: |
          bash -n deploy/install.sh
          bash -n deploy/doctor.sh
      - name: Build deploy bundle
        run: python scripts/build_deploy_bundle.py --version "$GITHUB_REF_NAME" --out dist-deploy
      - name: Inspect bundle
        run: |
          tar tzf "dist-deploy/verity-deploy-${GITHUB_REF_NAME#v}.tar.gz"
          cat dist-deploy/SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist-deploy/verity-deploy-*.tar.gz
            dist-deploy/verity-deploy.tar.gz
            dist-deploy/SHA256SUMS
          generate_release_notes: true
