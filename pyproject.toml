[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verity"
version = "0.4.0"
description = "Modular deepfake detection pipeline with containerized detectors and explainable findings"
readme = "README.md"
license = { text = "CC-BY-NC-4.0" }
authors = [{ name = "ADPer" }]
requires-python = ">=3.10"
keywords = ["deepfake", "forensics", "detection", "explainability", "investigations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Security",
]
dependencies = [
    "click>=8.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0",
    "filetype>=1.2",
    "numpy<2",
    "matplotlib>=3.10.9",
    "weasyprint>=60.0",
]

[project.optional-dependencies]
# HTTP API + web UI host. Kept optional so the CLI stays dependency-light.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
verity = "verity.cli:cli"
verity-server = "verity_api.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["verity*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
